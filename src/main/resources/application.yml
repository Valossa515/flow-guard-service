spring:
  application:
    name: flow-guard-service
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

rate-limit:
  default-rule:
    limit: 100
    window-seconds: 60
