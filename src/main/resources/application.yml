spring:
  application:
    name: flow-guard-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

rate-limit:
  default-rule:
    limit: 100
    window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: flow-guard-service

logging:
  level:
    root: INFO
    io.github.valossa515.flow_guard_service: INFO
